name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          # file_lock.py carries a whole msvcrt branch for Windows that has
          # never actually been executed. One job is enough to keep it honest.
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install document tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run unit tests
        env:
          UNIVERSAL_TRANSCRIBER_NO_UPDATE_CHECK: '1'
        run: python -m unittest discover -s tests -t tests -v

  mirror-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify .agents/skills mirrors skills/
        run: bash scripts/check-agents-mirror.sh

      - name: Verify deliberately duplicated files have not drifted
        run: bash scripts/check-shared-files.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: python3 -m pip install --upgrade pip ruff==0.16.8 mypy==2.3.1

      - name: Lint
        run: ruff check .

      # `ruff format` is deliberately not enforced. Adopting it would rewrite
      # 32 files at once, which would bury every real change under formatting
      # noise. Worth doing -- but as its own commit, on its own.

      - name: Type check
        run: mypy
